<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BEKKAN Staff</title>
<!-- Firebase SDK (Firestoreのみ) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCEtrzDne8LtbvdropYU9cOWYDFRG16kOE",
    authDomain: "bekkan-staff.firebaseapp.com",
    projectId: "bekkan-staff",
    storageBucket: "bekkan-staff.firebasestorage.app",
    messagingSenderId: "85058820142",
    appId: "1:85058820142:web:1d3ca6d724218cb74367bf"
  };

  const app    = initializeApp(firebaseConfig);
  const db     = getFirestore(app);
  const colRef = collection(db, 'staff');

  // リアルタイム同期
  onSnapshot(colRef, (snapshot) => {
    if(snapshot.empty){
      initFirestore();
      return;
    }
    const fetched = snapshot.docs.map(d => {
      const data = d.data();
      data.id = isNaN(d.id) ? d.id : Number(d.id);
      return data;
    });
    // シフト表の順番に並べ替え（DEFAULT_STAFFのid順）
    const orderMap = {};
    DEFAULT_STAFF.forEach((s, i) => { orderMap[s.id] = i; });
    staff = fetched.sort((a, b) => {
      const ai = orderMap[a.id] !== undefined ? orderMap[a.id] : 999;
      const bi = orderMap[b.id] !== undefined ? orderMap[b.id] : 999;
      return ai - bi;
    });
    renderCards();
    if(currentId !== null){
      const mb = document.getElementById('modal-body');
      if(mb && mb.innerHTML) mb.innerHTML = buildDetail(currentId);
    }
  });

  // 初回：デフォルトデータをFirestoreに投入
  async function initFirestore(){
    for(const s of DEFAULT_STAFF){
      await setDoc(doc(db, 'staff', String(s.id)), s);
    }
  }

  // グローバル公開
  window._setDoc    = (id, data) => setDoc(doc(db, 'staff', String(id)), sanitize(data));
  window._deleteDoc = (id)       => deleteDoc(doc(db, 'staff', String(id)));

  // Firestoreに保存できないundefinedを除去
  function sanitize(obj){
    return JSON.parse(JSON.stringify(obj, (k,v) => v === undefined ? null : v));
  }
</script>
<style>
:root{
  --ink:#1A1917;
  --paper:#F5F2EC;
  --surface:#FFFFFF;
  --gold:#C9A84C;
  --gold-light:#F0E4B8;
  --muted:#8A8880;
  --border:#E2DDD5;
  --step1:#E8EAF6;--step1t:#3949AB;
  --step2:#E8F5E9;--step2t:#2E7D32;
  --step3:#FFF3E0;--step3t:#E65100;
  --step4:#E3F2FD;--step4t:#1565C0;
  --step5:#FCE4EC;--step5t:#880E4F;
  --step6:#F3E5F5;--step6t:#6A1B9A;
  --step7:#E0F2F1;--step7t:#00695C;
  --goal:#1A1917;--goalt:#F5F2EC;

}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Helvetica Neue',Arial,'Hiragino Sans',sans-serif;min-height:100vh}

/* Header */
.header{background:var(--ink);color:var(--paper);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.header-logo{font-size:13px;letter-spacing:.18em;font-weight:500;opacity:.9}
.header-right{display:flex;align-items:center;gap:10px}

/* Controls */
.controls{padding:20px 24px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search-wrap{position:relative;flex:1;min-width:180px;max-width:280px}
.search-wrap input{width:100%;height:38px;padding:0 12px 0 36px;border-radius:20px;border:1px solid var(--border);background:var(--surface);font-size:14px;color:var(--ink);outline:none}
.search-wrap input:focus{border-color:var(--gold)}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px;pointer-events:none}
select.ctrl{height:38px;padding:0 10px;border-radius:20px;border:1px solid var(--border);background:var(--surface);font-size:13px;color:var(--ink);outline:none}
select.ctrl:focus{border-color:var(--gold)}
.add-btn{height:38px;padding:0 18px;border-radius:20px;border:none;background:var(--gold);color:#fff;font-size:13px;font-weight:600;letter-spacing:.04em;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.add-btn:hover{background:#b8932f}

/* Step filter pills */
.step-pills{padding:14px 24px 0;display:flex;gap:6px;flex-wrap:wrap}
.pill{height:28px;padding:0 14px;border-radius:14px;border:1px solid var(--border);background:var(--surface);font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .15s}
.pill:hover{border-color:var(--gold);color:var(--gold)}
.pill.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* View toggle */
.view-toggle{display:flex;gap:3px;background:rgba(255,255,255,.12);border-radius:8px;padding:3px}
.vt-btn{width:32px;height:28px;border:none;background:transparent;color:rgba(245,242,236,.55);border-radius:6px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.vt-btn:hover{color:var(--paper)}
.vt-btn.active{background:rgba(255,255,255,.18);color:var(--paper)}

/* Grid — view-1 / view-4 / view-16 */
.grid{padding:20px 24px 40px;display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));transition:gap .2s}
.grid.view-1{grid-template-columns:1fr;max-width:420px;margin:0 auto;gap:20px}
.grid.view-4{grid-template-columns:repeat(2,1fr);gap:14px}

.grid.view-16{grid-template-columns:repeat(4,1fr);gap:8px}

/* Card base */
.card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:var(--shadow)}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(26,25,23,.13)}
.card-photo{width:100%;aspect-ratio:1/1;background:var(--paper);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.card-photo img{width:100%;height:100%;object-fit:cover}
.card-initials{font-size:36px;font-weight:300;color:var(--muted);letter-spacing:-.02em}
.card-body{padding:14px 14px 12px}
.card-name{font-size:15px;font-weight:600;letter-spacing:.02em;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-tenure{font-size:12px;color:var(--muted);margin-bottom:12px}
.card-tenure span{color:var(--gold);font-weight:600}
.step-track{height:4px;background:var(--paper);border-radius:2px;overflow:hidden;margin-bottom:8px}
.step-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .4s}
.step-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;letter-spacing:.04em}

/* view-1: 横レイアウト */
.grid.view-1 .card{display:flex;flex-direction:row;border-radius:14px}
.grid.view-1 .card-photo{width:120px;min-width:120px;aspect-ratio:unset;border-radius:0}
.grid.view-1 .card-initials{font-size:44px}
.grid.view-1 .card-body{padding:18px 18px 14px;display:flex;flex-direction:column;justify-content:center;flex:1}

.grid.view-1 .step-badge{font-size:13px;padding:6px 14px}

/* view-16: コンパクト — 写真+名前+バッジのみ */

.grid.view-16 .card-name{font-size:11px;margin-bottom:1px}

/* Empty */
.empty{padding:60px 24px;text-align:center;color:var(--muted);font-size:14px}

/* =================== MODAL =================== */
.overlay{display:none;position:fixed;inset:0;background:rgba(26,25,23,.45);z-index:200;align-items:flex-end;justify-content:center}

/* Detail view */

.detail-step{padding:16px 22px;border-bottom:1px solid var(--border)}
.detail-step-label{font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
.step-road{display:flex;gap:4px;align-items:center}

.detail-section{padding:14px 22px;border-bottom:1px solid var(--border)}

.checklist-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.cl{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);padding:3px 0;cursor:pointer;user-select:none}

.tests-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.test-item{background:var(--paper);border-radius:8px;padding:12px}

.update-stamp{font-size:11px;color:var(--muted);padding:10px 22px 0;text-align:right}

/* Edit mode fields */

.edit-field label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.edit-field input,.edit-field select{width:100%;height:38px;padding:0 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-size:14px;color:var(--ink);font-family:inherit}

.modal-footer{padding:16px 22px 0;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--border);margin-top:16px}
.btn-cancel{height:40px;padding:0 18px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:14px;cursor:pointer}
.btn-save{height:40px;padding:0 22px;border-radius:20px;border:none;background:var(--gold);color:#fff;font-size:14px;font-weight:600;cursor:pointer}

.btn-edit{height:36px;padding:0 16px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-size:13px;cursor:pointer}

.edit-grid .full-col{grid-column:1/-1}

/* Step checklist sections */
.cl-step-section{margin-bottom:14px}
.cl-step-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}

.cl-overall-right{flex:1}
.cl-overall-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:4px}

.cl-overall-sub{font-size:12px;color:var(--muted)}

  padding:8px 18px;border-radius:20px;font-size:12px;z-index:999;

.pos-sections{padding-top:8px}
</style>
</head>
<body>

  <div class="header-logo">BEKKAN STAFF</div>
  <div class="header-right">
    <div class="view-toggle">
      <button class="vt-btn" id="vt1" onclick="setView(1)" title="1人表示">▬</button>

  <div class="modal" id="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">スタッフ詳細</div>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const STEPS=[
  {id:1,label:'入社手続き',short:'手続'},
  {id:2,label:'初日マニュアル',short:'初日'},
  {id:3,label:'座学',short:'座学'},
  {id:4,label:'ランナー',short:'RUN'},
  {id:5,label:'ラウンジ',short:'LNG'},
  {id:6,label:'個室',short:'個室'},
  {id:7,label:'習熟確認',short:'確認'},
  {id:8,label:'GOAL',short:'GOAL'},
];

// ステップ別チェックリスト定義
const STEP_CHECKS = {
  1: [
    { key:'contract',  label:'雇用契約書',   file:true },
    { key:'roster',    label:'従業員名簿',   file:true },
    { key:'photo',     label:'顔写真',       file:true },

  2: [
    { key:'attendance', label:'勤怠 / 基本姿勢',       file:false },
    { key:'grooming',   label:'身だしなみ',             file:false },
    { key:'bizrule',    label:'営業ルール',             file:false },
    { key:'labor',      label:'労務 / ハラスメント相談', file:false },
  ],
  3: [
    { key:'lecture',   label:'口頭研修',       file:false },
    { key:'roleplay',  label:'ロールプレイング', file:false },
    { key:'manual',    label:'マニュアル配布',  file:false },
  ],
  4: [
    { key:'runner_sheet', label:'ランナー業務チェックシート', file:false },
    { key:'test5',        label:'5大テスト',               file:false },

// ---- Tenure ----
function tenure(startStr){
  const s=new Date(startStr), now=new Date();
  let y=now.getFullYear()-s.getFullYear();
  let m=now.getMonth()-s.getMonth();
  if(m<0){y--;m+=12;}
  if(y>0) return `${y}年${m>0?m+'ヶ月':''}`;
  if(m>0) return `${m}ヶ月`;
  return '1ヶ月未満';
}

// ---- Step color ----
function stepStyle(sid){
  const map={1:'var(--step1)',2:'var(--step2)',3:'var(--step3)',4:'var(--step4)',5:'var(--step5)',6:'var(--step6)',7:'var(--step7)',8:'var(--goal)'};
  const tc={1:'var(--step1t)',2:'var(--step2t)',3:'var(--step3t)',4:'var(--step4t)',5:'var(--step5t)',6:'var(--step6t)',7:'var(--step7t)',8:'var(--goalt)'};
  return{bg:map[sid]||'var(--paper)',c:tc[sid]||'var(--muted)'};
}

// ---- Render cards ----
function makeCard(s, viewClass){
  const st=STEPS.find(x=>x.id===s.step)||STEPS[0];
  const {bg,c}=stepStyle(s.step);
  const stepItems=STEP_CHECKS[s.step]||[];
  const stepDone=stepItems.filter(it=>s.checks[it.key]).length;
  const pct=stepItems.length?Math.round(stepDone/stepItems.length*100):100;
  const photo=s.photo?`<img src="${s.photo}" alt="${s.name}">`:`<span class="card-initials">${initials(s.name)}</span>`;
  return`<div class="card" onclick="openDetail(${s.id})">
    <div class="card-photo">${photo}</div>
    <div class="card-body">
      <div class="card-name">${s.name}</div>
      <div class="card-tenure">勤続 <span>${tenure(s.start)}</span></div>
      <div class="step-track"><div class="step-fill" style="width:${pct}%"></div></div>
      <span class="step-badge" style="background:${bg};color:${c}">
        <span class="step-num">${s.step<=7?'STEP'+s.step:'★'}</span>${st.label}
      </span>
    </div>
  </div>`;
}

function renderCards(){
  const q=document.getElementById('search').value.toLowerCase();
  const posFilter=document.getElementById('pos-f').value;
  const grid=document.getElementById('grid');
  const viewCls='view-'+currentView;

  // ポジション一覧（順序固定）
  const POSITIONS=['ホール','アフター','BAR'];
  const targets=posFilter?[posFilter]:POSITIONS;

  const filtered=staff.filter(s=>{
    if(q && !s.name.toLowerCase().includes(q) && !s.kana.includes(q)) return false;
    if(activeStep && s.step!==activeStep) return false;
    return true;
  });

  if(!filtered.length){grid.innerHTML='<div class="empty">該当するスタッフがいません</div>';return;}

  let html='';
  targets.forEach(pos=>{
    const members=filtered.filter(s=>s.pos===pos);
    if(!members.length) return;
    html+=`<div class="pos-section">
      <div class="pos-section-header">
        <span class="pos-section-title">${pos}</span>
        <span class="pos-section-count">${members.length}名</span>
        <span class="pos-section-line"></span>
      </div>
      <div class="grid ${viewCls}" style="padding:0;margin:0">
        ${members.map(s=>makeCard(s)).join('')}
      </div>
    </div>`;
  });

  grid.innerHTML = html || '<div class="empty">該当するスタッフがいません</div>';
}

// ---- Quick actions from detail ----
function setStepDirect(stepId){
  const s=staff.find(x=>x.id===currentId); if(!s) return;
  s.step=stepId;
  s.updated=today(); s.updater='教育担当';
  if(window._setDoc) window._setDoc(currentId, s);
  document.getElementById('modal-body').innerHTML=buildDetail(currentId);
  renderCards();
}
function toggleCheckNew(id, key, el){
  const s=staff.find(x=>x.id===id); if(!s) return;
  if(!s.checks) s.checks={};
  s.checks[key] = el.checked;
  s.updated=today(); s.updater='教育担当';
  el.closest('.cl').classList.toggle('checked', el.checked);

  // Firestore保存
  if(window._setDoc) window._setDoc(id, s);

  // 現STEPの進捗を更新
  updateStepProgress(s);

  // 現STEPの全項目が埋まったら自動昇格
  const stepItems = STEP_CHECKS[s.step] || [];
  const allDone = stepItems.length > 0 && stepItems.every(it => s.checks[it.key]);
  if(allDone && s.step < 8){
    const nextStep = s.step + 1;
    s.step = nextStep;
    showStepUpBanner(nextStep);
    // モーダルを再描画
    setTimeout(()=>{
      document.getElementById('modal-body').innerHTML = buildDetail(id);
    }, 1200);
  }
  renderCards();
}

function updateStepProgress(s){
  const stepItems = STEP_CHECKS[s.step] || [];
  const done = stepItems.filter(it=>s.checks[it.key]).length;
  const pct  = stepItems.length ? Math.round(done/stepItems.length*100) : 100;
  const fillEl = document.getElementById('cl-fill');
  const subEl  = document.getElementById('cl-sub');
  const pctEl  = document.querySelector('.cl-overall-pct');
  if(fillEl) fillEl.style.width = pct+'%';
  if(subEl)  subEl.textContent  = done+' / '+stepItems.length+' 項目完了';
  if(pctEl)  pctEl.textContent  = pct+'%';
}

function showStepUpBanner(nextStep){
  const st = STEPS.find(x=>x.id===nextStep);
  const label = nextStep===8 ? '🏆 GOAL 達成！' : 'STEP '+nextStep+' '+st.label+' へ進みました';
  const banner = document.createElement('div');
  banner.id = 'stepup-banner';
  banner.innerHTML = label;
  Object.assign(banner.style,{
    position:'fixed', bottom:'80px', left:'50%', transform:'translateX(-50%) translateY(20px)',
    background:'#1A1917', color:'#F0E4B8', padding:'12px 28px',
    borderRadius:'40px', fontSize:'14px', fontWeight:'600',
    boxShadow:'0 4px 20px rgba(0,0,0,.3)', zIndex:'999',
    opacity:'0', transition:'all .4s', whiteSpace:'nowrap',
  });
  document.body.appendChild(banner);
  requestAnimationFrame(()=>{
    banner.style.opacity='1';
    banner.style.transform='translateX(-50%) translateY(0)';
  });
  setTimeout(()=>{
    banner.style.opacity='0';
    banner.style.transform='translateX(-50%) translateY(20px)';
    setTimeout(()=>banner.remove(), 400);
  }, 2000);
}
function triggerFileUpload(id, key, e){
  e.preventDefault(); e.stopPropagation();
  document.getElementById('file-'+key).click();
}
async function handleFileUpload(id, key, input){
  const s=staff.find(x=>x.id===id); if(!s) return;
  const file=input.files[0]; if(!file) return;
  if(!s.files) s.files={};
  showSaving();

  // Base64に変換してFirestoreに保存
  const base64 = await new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=e=>resolve(e.target.result);
    reader.readAsDataURL(file);
  });

  s.files[key]  = { name: file.name, url: base64 };
  s.checks[key] = true;
  s.updated = today();
  s.updater = '教育担当';

  if(window._setDoc) await window._setDoc(id, s);

  // 自動昇格チェック
  const stepItems = STEP_CHECKS[s.step] || [];
  const allDone = stepItems.length > 0 && stepItems.every(it => s.checks[it.key]);
  if(allDone && s.step < 8){
    s.step = s.step + 1;
    showStepUpBanner(s.step);
  }
  hideSaving();
  renderCards();
  setTimeout(()=>{
    document.getElementById('modal-body').innerHTML = buildDetail(id);
  }, allDone ? 1200 : 0);
}
function updateTest(id,field,val){
  const s=staff.find(x=>x.id===id); if(!s) return;
  s[field]=val; s.updated=today(); s.updater='教育担当';
  if(window._setDoc) window._setDoc(id, s);
  // re-render result badge
  const cls=val==='合格'?'pass':val==='不合格'?'fail':'none';
  const results=document.querySelectorAll('.test-result');
  const idx=field==='test1'?0:1;
  if(results[idx]){results[idx].className='test-result '+cls; results[idx].textContent=val||'未実施';}
  renderCards();
}
function updateNote(id,val){
  const s=staff.find(x=>x.id===id); if(!s) return;
  s.note=val; s.updated=today(); s.updater='教育担当';
  if(window._setDoc) window._setDoc(id, s);
}

async function saveEdit(id){
  const s=staff.find(x=>x.id===id); if(!s) return;
  const name=document.getElementById('e-name').value.trim();
  if(!name){alert('氏名を入力してください');return;}
  showSaving();

  // 顔写真：Base64でそのままFirestoreに保存
  const photoData = document.getElementById('e-photo-data').value;

  const updated = {
    ...s,
    name,
    kana:    document.getElementById('e-kana').value.trim(),
    start:   document.getElementById('e-start').value,
    emp:     document.getElementById('e-emp').value,
    pos:     document.getElementById('e-pos').value,
    photo:   photoData,
    updater: document.getElementById('e-updater').value.trim()||'教育担当',
    updated: today(),
  };
  Object.assign(s, updated);
  if(window._setDoc) await window._setDoc(id, updated);
  hideSaving();
  openDetail(id);
}

async function saveAdd(){
  const name=document.getElementById('a-name').value.trim();
  if(!name){alert('氏名を入力してください');return;}
  showSaving();
  const newId = nextId++;
  const s={
    id:newId, name,
    kana:    document.getElementById('a-kana').value.trim(),
    start:   document.getElementById('a-start').value,
    emp:     document.getElementById('a-emp').value,
    pos:     document.getElementById('a-pos').value,
    photo:   document.getElementById('a-photo-data').value,
    step:1, checks:{}, files:{}, test1:'', test2:'', note:'',
    updated: today(),
    updater: document.getElementById('a-updater').value.trim()||'教育担当',
  };
  staff.push(s);
  if(window._setDoc) await window._setDoc(newId, s);
  hideSaving();
  renderCards();
  closeModal();
}

// ---- Delete ----
async function deleteStaff(id){
  if(!confirm('このスタッフを削除しますか？')) return;
  staff=staff.filter(s=>s.id!==id);
  if(window._deleteDoc) await window._deleteDoc(id);
  renderCards();
  closeModal();
}


function showSaving(){ document.getElementById('saving-toast').classList.add('show'); }
function hideSaving(){ document.getElementById('saving-toast').classList.remove('show'); }

function today(){return new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit'}).replace(/\//g,'-')}
function closeModal(){document.getElementById('overlay').classList.remove('open');}
function overlayClick(e){if(e.target===document.getElementById('overlay')) closeModal();}


// ---- Photo upload helpers ----
function previewPhoto(fileInputId, previewId, dataId){
  const file = document.getElementById(fileInputId).files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const dataUrl = e.target.result;
    const preview = document.getElementById(previewId);
    preview.innerHTML = '<img src="'+dataUrl+'" alt="">';
    document.getElementById(dataId).value = dataUrl;
    // 削除ボタンを表示（追加フォームの場合）
    const clearBtn = document.getElementById('a-clear-btn');
    if(clearBtn) clearBtn.style.display = 'block';
  };
  reader.readAsDataURL(file);
}
function clearPhoto(previewId, dataId){
  document.getElementById(previewId).innerHTML = '📷';
  document.getElementById(dataId).value = '';
  const clearBtn = document.getElementById('a-clear-btn');
  if(clearBtn) clearBtn.style.display = 'none';
}

renderPills();
renderCards();
