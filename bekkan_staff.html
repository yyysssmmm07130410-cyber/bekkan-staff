<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BEKKAN Staff</title>
<!-- Firebase SDK (Firestoreのみ) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCEtrzDne8LtbvdropYU9cOWYDFRG16kOE",
    authDomain: "bekkan-staff.firebaseapp.com",
    projectId: "bekkan-staff",
    storageBucket: "bekkan-staff.firebasestorage.app",
    messagingSenderId: "85058820142",
    appId: "1:85058820142:web:1d3ca6d724218cb74367bf"
  };

  const app    = initializeApp(firebaseConfig);
  const db     = getFirestore(app);
  const colRef = collection(db, 'staff');

  // リアルタイム同期
  onSnapshot(colRef, (snapshot) => {
    if(snapshot.empty){
      initFirestore();
      return;
    }
    const fetched = snapshot.docs.map(d => {
      const data = d.data();
      data.id = isNaN(d.id) ? d.id : Number(d.id);
      return data;
    });
    // シフト表の順番に並べ替え（DEFAULT_STAFFのid順）
    const orderMap = {};
    DEFAULT_STAFF.forEach((s, i) => { orderMap[s.id] = i; });
    staff = fetched.sort((a, b) => {
      const ai = orderMap[a.id] !== undefined ? orderMap[a.id] : 999;
      const bi = orderMap[b.id] !== undefined ? orderMap[b.id] : 999;
      return ai - bi;
    });
    renderCards();
    if(currentId !== null){
      const mb = document.getElementById('modal-body');
      if(mb && mb.innerHTML) mb.innerHTML = buildDetail(currentId);
    }
  });

  // 初回：デフォルトデータをFirestoreに投入
  async function initFirestore(){
    for(const s of DEFAULT_STAFF){
      await setDoc(doc(db, 'staff', String(s.id)), s);
    }
  }

  // グローバル公開
  window._setDoc    = (id, data) => setDoc(doc(db, 'staff', String(id)), sanitize(data));
  window._deleteDoc = (id)       => deleteDoc(doc(db, 'staff', String(id)));

  // Firestoreに保存できないundefinedを除去
  function sanitize(obj){
    return JSON.parse(JSON.stringify(obj, (k,v) => v === undefined ? null : v));
  }
</script>
<style>
:root{
  --ink:#1A1917;
  --paper:#F5F2EC;
  --surface:#FFFFFF;
  --gold:#C9A84C;
  --gold-light:#F0E4B8;
  --muted:#8A8880;
  --border:#E2DDD5;
  --step1:#E8EAF6;--step1t:#3949AB;
  --step2:#E8F5E9;--step2t:#2E7D32;
  --step3:#FFF3E0;--step3t:#E65100;
  --step4:#E3F2FD;--step4t:#1565C0;
  --step5:#FCE4EC;--step5t:#880E4F;
  --step6:#F3E5F5;--step6t:#6A1B9A;
  --step7:#E0F2F1;--step7t:#00695C;
  --goal:#1A1917;--goalt:#F5F2EC;
  --radius:12px;
  --shadow:0 2px 12px rgba(26,25,23,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Helvetica Neue',Arial,'Hiragino Sans',sans-serif;min-height:100vh}

/* Header */
.header{background:var(--ink);color:var(--paper);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.header-logo{font-size:13px;letter-spacing:.18em;font-weight:500;opacity:.9}
.header-right{display:flex;align-items:center;gap:10px}

/* Controls */
.controls{padding:20px 24px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search-wrap{position:relative;flex:1;min-width:180px;max-width:280px}
.search-wrap input{width:100%;height:38px;padding:0 12px 0 36px;border-radius:20px;border:1px solid var(--border);background:var(--surface);font-size:14px;color:var(--ink);outline:none}
.search-wrap input:focus{border-color:var(--gold)}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px;pointer-events:none}
select.ctrl{height:38px;padding:0 10px;border-radius:20px;border:1px solid var(--border);background:var(--surface);font-size:13px;color:var(--ink);outline:none}
select.ctrl:focus{border-color:var(--gold)}
.add-btn{height:38px;padding:0 18px;border-radius:20px;border:none;background:var(--gold);color:#fff;font-size:13px;font-weight:600;letter-spacing:.04em;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.add-btn:hover{background:#b8932f}

/* Step filter pills */
.step-pills{padding:14px 24px 0;display:flex;gap:6px;flex-wrap:wrap}
.pill{height:28px;padding:0 14px;border-radius:14px;border:1px solid var(--border);background:var(--surface);font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .15s}
.pill:hover{border-color:var(--gold);color:var(--gold)}
.pill.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* View toggle */
.view-toggle{display:flex;gap:3px;background:rgba(255,255,255,.12);border-radius:8px;padding:3px}
.vt-btn{width:32px;height:28px;border:none;background:transparent;color:rgba(245,242,236,.55);border-radius:6px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.vt-btn:hover{color:var(--paper)}
.vt-btn.active{background:rgba(255,255,255,.18);color:var(--paper)}

/* Grid — view-1 / view-4 / view-16 */
.grid{padding:20px 24px 40px;display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));transition:gap .2s}
.grid.view-1{grid-template-columns:1fr;max-width:420px;margin:0 auto;gap:20px}
.grid.view-4{grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:600px){.grid.view-4{grid-template-columns:repeat(4,1fr)}}
.grid.view-16{grid-template-columns:repeat(4,1fr);gap:8px}
@media(min-width:600px){.grid.view-16{grid-template-columns:repeat(8,1fr)}}

/* Card base */
.card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:var(--shadow)}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(26,25,23,.13)}
.card-photo{width:100%;aspect-ratio:1/1;background:var(--paper);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.card-photo img{width:100%;height:100%;object-fit:cover}
.card-initials{font-size:36px;font-weight:300;color:var(--muted);letter-spacing:-.02em}
.card-body{padding:14px 14px 12px}
.card-name{font-size:15px;font-weight:600;letter-spacing:.02em;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-tenure{font-size:12px;color:var(--muted);margin-bottom:12px}
.card-tenure span{color:var(--gold);font-weight:600}
.step-track{height:4px;background:var(--paper);border-radius:2px;overflow:hidden;margin-bottom:8px}
.step-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .4s}
.step-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;letter-spacing:.04em}
.step-num{font-size:10px;opacity:.75}

/* view-1: 横レイアウト */
.grid.view-1 .card{display:flex;flex-direction:row;border-radius:14px}
.grid.view-1 .card-photo{width:120px;min-width:120px;aspect-ratio:unset;border-radius:0}
.grid.view-1 .card-initials{font-size:44px}
.grid.view-1 .card-body{padding:18px 18px 14px;display:flex;flex-direction:column;justify-content:center;flex:1}
.grid.view-1 .card-name{font-size:20px;margin-bottom:4px}
.grid.view-1 .card-tenure{font-size:13px;margin-bottom:16px}
.grid.view-1 .step-badge{font-size:13px;padding:6px 14px}

/* view-16: コンパクト — 写真+名前+バッジのみ */
.grid.view-16 .card{border-radius:10px}
.grid.view-16 .card-body{padding:6px 8px 8px}
.grid.view-16 .card-name{font-size:11px;margin-bottom:1px}
.grid.view-16 .card-tenure{display:none}
.grid.view-16 .step-track{height:3px;margin-bottom:5px}
.grid.view-16 .step-badge{font-size:9px;padding:2px 6px;border-radius:4px}
.grid.view-16 .step-num{display:none}
.grid.view-16 .card-initials{font-size:22px}

/* Empty */
.empty{padding:60px 24px;text-align:center;color:var(--muted);font-size:14px}

/* =================== MODAL =================== */
.overlay{display:none;position:fixed;inset:0;background:rgba(26,25,23,.45);z-index:200;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
@media(min-width:600px){.overlay.open{align-items:center}}
.modal{background:var(--surface);width:100%;max-width:540px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:0 0 32px}
@media(min-width:600px){.modal{border-radius:20px;max-height:88vh}}

.modal-header{position:sticky;top:0;background:var(--surface);padding:18px 22px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;z-index:5}
.modal-title{font-size:16px;font-weight:600;letter-spacing:.03em}
.close-btn{width:30px;height:30px;border-radius:50%;border:none;background:var(--paper);color:var(--ink);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.close-btn:hover{background:var(--border)}

/* Detail view */
.detail-hero{display:flex;align-items:center;gap:16px;padding:20px 22px 16px;border-bottom:1px solid var(--border)}
.detail-photo{width:72px;height:72px;border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--muted);overflow:hidden;flex-shrink:0}
.detail-photo img{width:100%;height:100%;object-fit:cover}
.detail-name{font-size:20px;font-weight:700;letter-spacing:.01em}
.detail-kana{font-size:13px;color:var(--muted);margin-bottom:4px}
.detail-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11px;padding:3px 10px;border-radius:20px;background:var(--paper);border:1px solid var(--border);color:var(--muted)}

.detail-step{padding:16px 22px;border-bottom:1px solid var(--border)}
.detail-step-label{font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
.step-road{display:flex;gap:4px;align-items:center}
.step-node{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;cursor:pointer}
.step-dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--muted);background:var(--surface);transition:all .15s}
.step-node.done .step-dot{background:var(--gold);border-color:var(--gold);color:#fff}
.step-node.current .step-dot{background:var(--ink);border-color:var(--ink);color:var(--paper);box-shadow:0 0 0 3px var(--gold-light)}
.step-connector{height:2px;background:var(--border);flex:1;margin-bottom:14px}
.step-connector.done{background:var(--gold)}
.step-node-label{font-size:9px;color:var(--muted);text-align:center;line-height:1.2;max-width:40px}
.step-node.current .step-node-label{color:var(--ink);font-weight:600}

.detail-section{padding:14px 22px;border-bottom:1px solid var(--border)}
.section-label{font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
.checklist-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.cl{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);padding:3px 0;cursor:pointer;user-select:none}
.cl input{accent-color:var(--gold);width:15px;height:15px;cursor:pointer}
.cl.checked{color:var(--ink)}
.cl-progress{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cl-pct{font-size:24px;font-weight:700;color:var(--ink)}
.cl-bar-wrap{flex:1}
.cl-bar{height:6px;background:var(--paper);border-radius:3px;overflow:hidden}
.cl-bar-fill{height:100%;background:var(--gold);border-radius:3px;transition:width .4s}
.cl-sub{font-size:12px;color:var(--muted)}

.tests-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* Test record expanded */
.test-item{background:var(--paper);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.test-item-header{display:flex;align-items:center;justify-content:space-between}
.test-name{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.test-result{font-size:14px;font-weight:700}
.test-result.pass{color:#2E7D32}
.test-result.fail{color:#C62828}
.test-result.none{color:var(--muted);font-weight:400;font-size:13px}
.test-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.test-field label{font-size:11px;color:var(--muted);display:block;margin-bottom:3px}
.test-field input,.test-field select{width:100%;height:34px;padding:0 8px;border-radius:6px;border:1px solid var(--border);background:var(--surface);font-size:13px;color:var(--ink);font-family:inherit}
.test-field input:focus,.test-field select:focus{outline:none;border-color:var(--gold)}
.test-score-avg{font-size:12px;color:var(--muted);text-align:right;margin-top:2px}
.test-file-row{display:flex;align-items:center;gap:8px;margin-top:2px}
.test-file-btn{font-size:11px;padding:4px 12px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;white-space:nowrap}
.test-file-btn:hover{border-color:var(--gold);color:var(--gold)}
.test-file-btn.uploaded{border-color:#2E7D32;color:#2E7D32;background:#E8F5E9}
.test-file-name{font-size:11px;color:var(--gold);cursor:pointer;text-decoration:underline}

.test-item{background:var(--paper);border-radius:8px;padding:12px}
.test-name{font-size:11px;color:var(--muted);margin-bottom:6px}
.test-result{font-size:15px;font-weight:700}
.test-result.pass{color:#2E7D32}
.test-result.fail{color:#C62828}
.test-result.none{color:var(--muted);font-weight:400;font-size:13px}
.test-select{width:100%;height:32px;border-radius:6px;border:1px solid var(--border);background:var(--surface);font-size:13px;color:var(--ink);margin-top:4px;padding:0 8px}

.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info-item{background:var(--paper);border-radius:8px;padding:12px}
.info-label{font-size:11px;color:var(--muted);margin-bottom:3px}
.info-val{font-size:14px;font-weight:500}

.note-area textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px;font-size:13px;color:var(--ink);resize:vertical;min-height:72px;background:var(--surface);font-family:inherit}
.note-area textarea:focus{outline:none;border-color:var(--gold)}

.update-stamp{font-size:11px;color:var(--muted);padding:10px 22px 0;text-align:right}

/* Edit mode fields */
.edit-field{margin-bottom:10px}
.edit-field label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.edit-field input,.edit-field select{width:100%;height:38px;padding:0 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-size:14px;color:var(--ink);font-family:inherit}
.edit-field input:focus,.edit-field select:focus{outline:none;border-color:var(--gold)}
.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.modal-footer{padding:16px 22px 0;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--border);margin-top:16px}
.btn-cancel{height:40px;padding:0 18px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:14px;cursor:pointer}
.btn-save{height:40px;padding:0 22px;border-radius:20px;border:none;background:var(--gold);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.btn-save:hover{background:#b8932f}
.btn-edit{height:36px;padding:0 16px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-size:13px;cursor:pointer}
.btn-edit:hover{background:var(--paper)}
.btn-delete{height:36px;padding:0 16px;border-radius:20px;border:none;background:transparent;color:#C62828;font-size:13px;cursor:pointer}

/* Photo upload */
.photo-upload-wrap{display:flex;align-items:center;gap:14px}
.photo-preview{width:72px;height:72px;border-radius:50%;background:var(--paper);border:1px solid var(--border);overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:26px}
.photo-preview img{width:100%;height:100%;object-fit:cover}
.photo-upload-right{display:flex;flex-direction:column;gap:4px}
.upload-btn{height:34px;padding:0 16px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-size:13px;cursor:pointer;white-space:nowrap}
.upload-btn:hover{background:var(--paper)}
.clear-btn{height:28px;padding:0 12px;border-radius:20px;border:none;background:transparent;color:#C62828;font-size:12px;cursor:pointer;text-align:left}
.edit-grid .full-col{grid-column:1/-1}

/* Step checklist sections */
.cl-step-section{margin-bottom:14px}
.cl-step-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cl-step-title{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cl-step-count{font-size:11px;color:var(--muted)}
.cl-list{display:flex;flex-direction:column;gap:3px}
.cl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:6px 10px;border-radius:8px;background:var(--paper);cursor:pointer;user-select:none;transition:background .12s}
.cl:hover{background:var(--gold-light)}
.cl input{accent-color:var(--gold);width:16px;height:16px;cursor:pointer;flex-shrink:0}
.cl.checked{color:var(--ink);background:var(--paper)}
.cl.checked .cl-label{text-decoration:none}
.cl-label{flex:1}
.cl-file-btn{font-size:11px;padding:3px 10px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;white-space:nowrap;flex-shrink:0}
.cl-file-btn:hover{border-color:var(--gold);color:var(--gold)}
.cl-file-btn.uploaded{border-color:#2E7D32;color:#2E7D32;background:#E8F5E9}
.cl-file-preview{display:block;margin:4px 0 4px 24px;font-size:11px;color:var(--muted);word-break:break-all}
.cl-file-preview a{color:var(--gold);text-decoration:none}
/* overall progress */
.cl-overall{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding:12px 16px;background:var(--paper);border-radius:10px}
.cl-overall-pct{font-size:28px;font-weight:700;color:var(--ink);line-height:1}
.cl-overall-right{flex:1}
.cl-overall-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:4px}
.cl-overall-fill{height:100%;background:var(--gold);border-radius:3px;transition:width .4s}
.cl-overall-sub{font-size:12px;color:var(--muted)}

/* Saving indicator */
.saving-toast{position:fixed;top:66px;right:16px;background:var(--ink);color:var(--paper);
  padding:8px 18px;border-radius:20px;font-size:12px;z-index:999;
  opacity:0;transition:opacity .2s;pointer-events:none}
.saving-toast.show{opacity:1}

/* Position sections */
.pos-section{padding:0 24px 32px}
.pos-section:first-child{padding-top:20px}
.pos-section-header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.pos-section-title{font-size:12px;font-weight:600;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.pos-section-count{font-size:12px;color:var(--muted);background:var(--paper);border:0.5px solid var(--border);border-radius:20px;padding:1px 10px}
.pos-section-line{flex:1;height:0.5px;background:var(--border)}
.pos-sections{padding-top:8px}

/* Auth screen */
.auth-screen{position:fixed;inset:0;background:var(--ink);display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:0}
.auth-box{background:#2A2927;border:0.5px solid #3A3835;border-radius:20px;padding:40px 32px;width:320px;text-align:center}
.auth-logo{font-size:11px;letter-spacing:.2em;color:#C9A84C;margin-bottom:24px;font-weight:600}
.auth-title{font-size:18px;color:#F5F2EC;font-weight:500;margin-bottom:8px}
.auth-sub{font-size:12px;color:#8A8880;margin-bottom:24px}
.auth-input{width:100%;height:44px;background:#1A1917;border:0.5px solid #3A3835;border-radius:10px;color:#F5F2EC;font-size:15px;padding:0 14px;text-align:center;letter-spacing:.1em;outline:none;margin-bottom:12px}
.auth-input:focus{border-color:#C9A84C}
.auth-btn{width:100%;height:44px;background:#C9A84C;border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:12px}
.auth-btn:hover{background:#b8932f}
.auth-err{font-size:12px;color:#ff6b6b;min-height:18px}
.auth-mode{font-size:12px;color:#8A8880;cursor:pointer;text-decoration:underline}

/* File preview modal */
.file-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:500;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.file-overlay.open{display:flex}
.file-overlay img{max-width:90vw;max-height:80vh;border-radius:8px;object-fit:contain}
.file-overlay iframe{width:90vw;height:80vh;border:none;border-radius:8px;background:#fff}
.file-close{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* Stats bar */
.stats-bar{padding:12px 24px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:0.5px solid var(--border);background:var(--surface)}
.stat-chip{display:flex;flex-direction:column;align-items:center;padding:6px 14px;border-radius:10px;background:var(--paper);border:0.5px solid var(--border);min-width:64px}
.stat-num{font-size:18px;font-weight:700;color:var(--ink);line-height:1}
.stat-label{font-size:10px;color:var(--muted);margin-top:2px;letter-spacing:.04em}
.stat-chip.gold .stat-num{color:#C9A84C}

/* Card redesign */
.card-age{font-size:11px;color:var(--muted);margin-bottom:4px}
.card-sections{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:6px}
.sec-badge{font-size:9px;padding:2px 7px;border-radius:4px;font-weight:600}
.sec-runner{background:#E3F2FD;color:#1565C0}
.sec-lounge{background:#FCE4EC;color:#880E4F}
.sec-room{background:#E0F2F1;color:#00695C}
.sec-bar{background:#FFF3E0;color:#E65100}
.card-pct{font-size:11px;color:var(--muted);text-align:right;margin-bottom:2px}

/* Step 2段表示 */
.step-two-col{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.step-col-label{font-size:10px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-bottom:6px;font-weight:600}
.step-road-v{display:flex;flex-direction:column;gap:4px}
.step-node-v{display:flex;align-items:center;gap:6px;cursor:pointer;padding:3px 0}
.step-dot-v{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:var(--muted);background:var(--surface);flex-shrink:0;transition:all .15s}
.step-node-v.done .step-dot-v{background:var(--gold);border-color:var(--gold);color:#fff}
.step-node-v.current .step-dot-v{background:var(--ink);border-color:var(--ink);color:var(--paper);box-shadow:0 0 0 3px var(--gold-light)}
.step-node-v-label{font-size:11px;color:var(--muted);line-height:1.2}
.step-node-v.current .step-node-v-label{color:var(--ink);font-weight:600}
.step-node-v.done .step-node-v-label{color:var(--ink)}

/* Accordion checklist */
.acc-section{border:0.5px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:8px}
.acc-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;background:var(--paper);user-select:none}
.acc-header:hover{background:var(--gold-light)}
.acc-title{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.acc-meta{display:flex;align-items:center;gap:8px}
.acc-count{font-size:11px;color:var(--muted)}
.acc-arrow{font-size:12px;color:var(--muted);transition:transform .2s}
.acc-arrow.open{transform:rotate(180deg)}
.acc-body{display:none;padding:10px 14px;background:var(--surface)}
.acc-body.open{display:block}

/* 研修記録フォーム */
.train-record{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px;padding:8px;background:var(--paper);border-radius:8px}
.train-field label{font-size:10px;color:var(--muted);display:block;margin-bottom:2px}
.train-field input{width:100%;height:30px;padding:0 8px;border-radius:6px;border:0.5px solid var(--border);background:var(--surface);font-size:12px;color:var(--ink);font-family:inherit}
.train-badge{font-size:10px;padding:2px 8px;border-radius:4px;background:var(--bg-accent);color:var(--text-accent);display:inline-block;margin-bottom:4px}
.lounge-note{font-size:10px;color:var(--text-muted);margin-bottom:6px;padding:4px 8px;background:var(--paper);border-radius:6px;border-left:2px solid var(--gold)}
</style>
</head>

// ---- Tenure ----
function tenure(startStr){
  const s=new Date(startStr), now=new Date();
  let y=now.getFullYear()-s.getFullYear();
  let m=now.getMonth()-s.getMonth();
  if(m<0){y--;m+=12;}
  if(y>0) return `${y}年${m>0?m+'ヶ月':''}`;
  if(m>0) return `${m}ヶ月`;
  return '1ヶ月未満';
}

// ---- ランクカラー ----
function rankBar(step){
  const bronze='linear-gradient(180deg,#E8B88A 0%,#CD7F32 40%,#A0522D 100%)';
  const silver='linear-gradient(180deg,#E8E8E8 0%,#A8A9AD 40%,#6B6B70 100%)';
  const gold  ='linear-gradient(180deg,#F5E27A 0%,#C9A84C 40%,#8B6914 100%)';
  const emerald='linear-gradient(180deg,#A8F0C8 0%,#2ECC71 30%,#1A7A43 60%,#A8F0C8 100%)';
  const blue  ='linear-gradient(180deg,#A8D4F8 0%,#3A8FD6 30%,#1565C0 60%,#A8D4F8 100%)';
  const purple='linear-gradient(180deg,#C4BEFF 0%,#7F77DD 30%,#3C3489 60%,#C4BEFF 100%)';
  const black ='linear-gradient(180deg,#888880 0%,#2C2C2A 30%,#111110 60%,#888880 100%)';
  if(step<=3) return bronze;
  if(step===4) return silver;
  if(step===5) return gold;
  if(step===6) return emerald;
  if(step===7) return blue;
  if(step===8) return purple;
  return black;
}
function stepStyle(sid){
  const map={1:'var(--step1)',2:'var(--step2)',3:'var(--step3)',4:'var(--step4)',5:'var(--step5)',6:'var(--step6)',7:'var(--step7)',8:'var(--goal)'};
  const tc={1:'var(--step1t)',2:'var(--step2t)',3:'var(--step3t)',4:'var(--step4t)',5:'var(--step5t)',6:'var(--step6t)',7:'var(--step7t)',8:'var(--goalt)'};
  return{bg:map[sid]||'var(--paper)',c:tc[sid]||'var(--muted)'};
}

function initials(n){return n.replace(/\s/g,'').slice(0,2);}

// ---- Render pills ----
function renderStats(){
  const el=document.getElementById('stats-bar');
  if(!el) return;
  const total=staff.length;
  const goal=staff.filter(s=>s.step>=7).length;
  const room=staff.filter(s=>s.step>=6).length;
  const lounge=staff.filter(s=>s.step>=5).length;
  const runner=staff.filter(s=>s.step>=4).length;
  const bar=staff.filter(s=>s.pos==='BAR').length;
  el.innerHTML=`
    <div class="stat-chip"><div class="stat-num">${total}</div><div class="stat-label">在籍</div></div>
    <div class="stat-chip gold"><div class="stat-num">${goal}</div><div class="stat-label">全個室可</div></div>
    <div class="stat-chip"><div class="stat-num">${room}</div><div class="stat-label">個室</div></div>
    <div class="stat-chip"><div class="stat-num">${lounge}</div><div class="stat-label">ラウンジ</div></div>
    <div class="stat-chip"><div class="stat-num">${runner}</div><div class="stat-label">ランナー</div></div>
    <div class="stat-chip"><div class="stat-num">${bar}</div><div class="stat-label">BAR</div></div>
  `;
}

// ---- Render cards ----
function calcAge(birthStr){
  if(!birthStr) return null;
  const b=new Date(birthStr), now=new Date();
  let age=now.getFullYear()-b.getFullYear();
  if(now.getMonth()<b.getMonth()||(now.getMonth()===b.getMonth()&&now.getDate()<b.getDate())) age--;
  return age;
}
function sectionBadges(s){
  let badges='';
  if(s.step>=4) badges+=`<span class="sec-badge sec-runner">ランナー</span>`;
  if(s.step>=5) badges+=`<span class="sec-badge sec-lounge">ラウンジ</span>`;
  if(s.step>=6) badges+=`<span class="sec-badge sec-room">個室</span>`;
  if(s.step>=7) badges+=`<span class="sec-badge" style="background:#E6F1FB;color:#1565C0">全個室可</span>`;
  if(s.step>=8) badges+=`<span class="sec-badge" style="background:#EEEDFE;color:#3C3489">ポーター</span>`;
  if(s.step>=9) badges+=`<span class="sec-badge" style="background:#2C2C2A;color:#F1EFE8">センター</span>`;
  if(s.pos==='BAR') badges+=`<span class="sec-badge sec-bar">BAR</span>`;
  return badges;
}
function makeCard(s){
  // 全STEPを通じた総合進行度
  const allItems=Object.values(STEP_CHECKS).flat();
  const allDone=allItems.filter(it=>s.checks[it.key]).length;
  const totalPct=allItems.length?Math.round(allDone/allItems.length*100):0;
  const photo=s.photo?`<img src="${s.photo}" alt="${s.name}">`:`<span class="card-initials">${initials(s.name)}</span>`;
  const age=calcAge(s.birth);
  const ageStr=age!==null?`${age}歳`:'';
  const tenureStr=tenure(s.start);
  const badges=sectionBadges(s);
  const {bg,c}=stepStyle(s.step);
  const st=STEPS.find(x=>x.id===s.step)||STEPS[0];
  const bar=rankBar(s.step);
  const stLabel=st.id<=9?`STEP${st.id} ${st.label}`:st.label;
  return`<div class="card" onclick="openDetail(${s.id})" style="display:flex;flex-direction:row">
    <div style="width:6px;flex-shrink:0;background:${bar}"></div>
    <div style="flex:1;overflow:hidden">
      <div class="card-photo">${photo}</div>
      <div class="card-body">
        <div class="card-name">${s.name}</div>
        <div class="card-age">${[ageStr, tenureStr?'勤続'+tenureStr:''].filter(Boolean).join(' · ')}</div>
        ${badges?`<div class="card-sections">${badges}</div>`:'<div style="height:4px"></div>'}
        <div class="card-pct">${totalPct}%</div>
        <div class="step-track"><div class="step-fill" style="width:${totalPct}%;background:${bar.includes('gradient')?bar:'var(--gold'})"></div></div>
        <div style="font-size:9px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${stLabel}</div>
      </div>
    </div>
  </div>`;
}

function renderCards(){
  const q=document.getElementById('search').value.toLowerCase();
  const posFilter=document.getElementById('pos-f').value;
  const grid=document.getElementById('grid');
  const viewCls='view-'+currentView;

  // ポジション一覧（順序固定）
  const POSITIONS=['ホール','アフター','BAR','外注'];
  const targets=posFilter?[posFilter]:POSITIONS;

  const filtered=staff.filter(s=>{
    if(q && !s.name.toLowerCase().includes(q) && !s.kana.includes(q)) return false;
    if(activeStep && s.step!==activeStep) return false;
    return true;
  });

  if(!filtered.length){grid.innerHTML='<div class="empty">該当するスタッフがいません</div>';return;}

  let html='';
  targets.forEach(pos=>{
    const members=filtered.filter(s=>s.pos===pos);
    if(!members.length) return;
    html+=`<div class="pos-section">
      <div class="pos-section-header">
        <span class="pos-section-title">${pos}</span>
        <span class="pos-section-count">${members.length}名</span>
        <span class="pos-section-line"></span>
      </div>
      <div class="grid ${viewCls}" style="padding:0;margin:0">
        ${members.map(s=>makeCard(s)).join('')}
      </div>
    </div>`;
  });

  grid.innerHTML = html || '<div class="empty">該当するスタッフがいません</div>';
  renderStats();
}

// ---- Detail modal ----
function openDetail(id){
  currentId=id; isEdit=false;
  document.getElementById('modal-title').textContent='スタッフ詳細';
  document.getElementById('modal-body').innerHTML=buildDetail(id);
  document.getElementById('overlay').classList.add('open');
}

      <div class="step-dot-v">${st.id<=7?st.id:'★'}</div>

function toggleCheckNew(id, key, el){
  if(!isEditable()){el.checked=!el.checked;return;}
  const s=staff.find(x=>x.id===id); if(!s) return;
  if(!s.checks) s.checks={};
  s.checks[key] = el.checked;
  s.updated=today(); s.updater='教育担当';
  el.closest('.cl').classList.toggle('checked', el.checked);

  // Firestore保存
  if(window._setDoc) window._setDoc(id, s);

  // 現STEPの進捗を更新
  updateStepProgress(s);

  // 5大テスト自動完了チェック
  const BIG5=['hw','bottle','grand','food','cocktail'];
  if(BIG5.some(k=>k===key)){
    const all5done=BIG5.every(k=>s.checks['test5_'+k+'_pass']);
    if(all5done && !s.checks['test5']){
      s.checks['test5']=true;
    }
  }
  // 現STEPの全項目が埋まったら自動昇格
  const stepItems = STEP_CHECKS[s.step] || [];
  const allDone = stepItems.length > 0 && stepItems.every(it => s.checks[it.key]);
  if(allDone && s.step < 8){
    const nextStep = s.step + 1;
    s.step = nextStep;
    showStepUpBanner(nextStep);
    // モーダルを再描画
    setTimeout(()=>{
      document.getElementById('modal-body').innerHTML = buildDetail(id);
    }, 1200);
  }
  renderCards();
}

function updateStepProgress(s){
  const stepItems = STEP_CHECKS[s.step] || [];
  const done = stepItems.filter(it=>s.checks[it.key]).length;
  const pct  = stepItems.length ? Math.round(done/stepItems.length*100) : 100;
  const fillEl = document.getElementById('cl-fill');
  const subEl  = document.getElementById('cl-sub');
  const pctEl  = document.querySelector('.cl-overall-pct');
  if(fillEl) fillEl.style.width = pct+'%';
  if(subEl)  subEl.textContent  = done+' / '+stepItems.length+' 項目完了';
  if(pctEl)  pctEl.textContent  = pct+'%';
}

function showStepUpBanner(nextStep){
  const st = STEPS.find(x=>x.id===nextStep);
  const label = 'STEP '+nextStep+' '+st.label+' へ進みました！';
  const banner = document.createElement('div');
  banner.id = 'stepup-banner';
  banner.innerHTML = label;
  Object.assign(banner.style,{
    position:'fixed', bottom:'80px', left:'50%', transform:'translateX(-50%) translateY(20px)',
    background:'#1A1917', color:'#F0E4B8', padding:'12px 28px',
    borderRadius:'40px', fontSize:'14px', fontWeight:'600',
    boxShadow:'0 4px 20px rgba(0,0,0,.3)', zIndex:'999',
    opacity:'0', transition:'all .4s', whiteSpace:'nowrap',
  });
  document.body.appendChild(banner);
  requestAnimationFrame(()=>{
    banner.style.opacity='1';
    banner.style.transform='translateX(-50%) translateY(0)';
  });
  setTimeout(()=>{
    banner.style.opacity='0';
    banner.style.transform='translateX(-50%) translateY(20px)';
    setTimeout(()=>banner.remove(), 400);
  }, 2000);
}

function updateTestField(id, field, val){
  if(!isEditable()) return;
  const s=staff.find(x=>x.id===id); if(!s) return;
  s[field]=val;
  s.updated=today(); s.updater='教育担当';
  if(window._setDoc) window._setDoc(id, s);
  // 合否バッジをリアルタイム更新
  if(field==='test1'||field==='test2'){
    const cls=val==='合格'?'pass':val==='不合格'?'fail':'none';
    const badges=document.querySelectorAll('.test-item-header .test-result');
    const idx=field==='test1'?0:1;
    if(badges[idx]){badges[idx].className='test-result '+cls;badges[idx].textContent=val||'未実施';}
  }
  // 実技テストの平均をリアルタイム更新
  if(field==='test2Score1'||field==='test2Score2'){
    const s1=Number(s.test2Score1)||0;
    const s2=Number(s.test2Score2)||0;
    const avgEl=document.querySelector('.test-score-avg');
    if(s.test2Score1||s.test2Score2){
      const avg=Math.round((s1+s2)/(s.test2Score1&&s.test2Score2?2:1));
      const pass=s.test2Score1&&s.test2Score2&&avg>=80;
      if(avgEl) avgEl.textContent=`平均：${avg}点 ${pass?'✅ 合格ライン':''}（80点以上で合格）`;
    }
  }
  renderCards();
}

function previewPhoto(fileInputId, previewId, dataId){
  const file = document.getElementById(fileInputId).files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const dataUrl = e.target.result;
    const preview = document.getElementById(previewId);
    preview.innerHTML = '<img src="'+dataUrl+'" alt="">';
    document.getElementById(dataId).value = dataUrl;
    // 削除ボタンを表示（追加フォームの場合）
    const clearBtn = document.getElementById('a-clear-btn');
    if(clearBtn) clearBtn.style.display = 'block';
  };
  reader.readAsDataURL(file);
}
function clearPhoto(previewId, dataId){
  document.getElementById(previewId).innerHTML = '📷';

  if(val === PW_EDIT){
    authMode = 'edit';
    document.getElementById('auth-screen').style.display='none';
    applyAuthMode();
  } else if(val === PW_VIEW){
    authMode = 'view';
    document.getElementById('auth-screen').style.display='none';
    applyAuthMode();
  } else {
    document.getElementById('auth-err').textContent='パスワードが違います';
    document.getElementById('auth-input').value='';
  }
}
function applyAuthMode(){
  // 閲覧モードの場合、編集系ボタンを非表示
  if(authMode==='view'){
    document.querySelectorAll('.add-btn,.btn-edit,.btn-delete,.btn-save,.upload-btn,.cl-file-btn').forEach(el=>el.style.display='none');
    // チェックボックスを無効化
    document.querySelectorAll('#modal-body input[type=checkbox],#modal-body select,#modal-body textarea').forEach(el=>el.disabled=true);
  }
}
function isEditable(){
  if(authMode!=='edit'){
    alert('編集権限がありません。編集用パスワードでログインしてください。');
    return false;
  }
  return true;
}

// ============ ファイルプレビュー ============
function openFilePreview(url, name, e){
  if(e){e.preventDefault();e.stopPropagation();}
  const overlay=document.getElementById('file-overlay');
  const content=document.getElementById('file-preview-content');
  if(url.startsWith('data:image') || url.match(/\.(jpg|jpeg|png|gif|webp)/i)){
    content.innerHTML=`<img src="${url}" alt="${name}">`;
  } else {
    // PDF等はiframeで表示
    content.innerHTML=`<iframe src="${url}"></iframe>`;
  }
  overlay.classList.add('open');
}
function closeFilePreview(e){
  if(e && e.target!==document.getElementById('file-overlay') && !e.target.classList.contains('file-close')) return;
  document.getElementById('file-overlay').classList.remove('open');
  document.getElementById('file-preview-content').innerHTML='';
}

renderStats();
renderCards();
</script>
